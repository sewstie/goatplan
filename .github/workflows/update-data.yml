name: Update course data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download WPI course listings
        run: npm run data:fetch

      - name: Build clean term files
        run: |
          if [ -f scripts/normalize.mjs ]; then
            npm run data:normalize
          else
            echo "normalize.mjs not written yet, skipping"
          fi

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data
          if git diff --cached --quiet; then
            echo "No changes in course data."
          else
            git commit -m "Update course data $(date -u +%Y-%m-%d)"
            git push
          fi
